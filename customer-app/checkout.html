<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Happy Burger — Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/checkout.css" />
</head>
<body>

<header class="hb-header">
  <a href="index.html" class="hb-logo">HAPPY BURGER</a>
  <a href="menu.html" class="back-link">← Back to Menu</a>
</header>

<main class="checkout-page container">
  <h1>Checkout</h1>
  <p class="text-muted">Complete your order details below.</p>

  <div class="checkout-layout">

    <div class="checkout-form-col">

      <section class="checkout-section">
        <h3><i data-lucide="user"></i> Contact Information</h3>
        <div class="checkout-grid-2">
          <div class="field">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Juan Dela Cruz" required />
          </div>
          <div class="field">
            <label for="contactNumber">Contact Number</label>
            <input type="tel" id="contactNumber" placeholder="+63 900 000 0000" required />
          </div>
        </div>
      </section>

      <section class="checkout-section">
        <h3><i data-lucide="truck"></i> Fulfillment Method</h3>
        <div class="option-grid" id="fulfillment-options">
          <button type="button" class="option-card active" data-fulfillment="PICKUP">
            <span class="option-icon"><i data-lucide="store"></i></span>
            <span class="option-title">Pick-up</span>
            <span class="option-desc">Collect at store counter</span>
          </button>
          <button type="button" class="option-card" data-fulfillment="MEETUP">
            <span class="option-icon"><i data-lucide="users"></i></span>
            <span class="option-title">Meet-up</span>
            <span class="option-desc">Meet at designated location</span>
          </button>
          <button type="button" class="option-card" data-fulfillment="DELIVERY">
            <span class="option-icon"><i data-lucide="bike"></i></span>
            <span class="option-title">Delivery</span>
            <span class="option-desc">Delivered via partner courier</span>
          </button>
        </div>
      </section>

      <section class="checkout-section">
        <h3><i data-lucide="credit-card"></i> Payment Method</h3>
        <div class="payment-options" id="payment-options">
          <button type="button" class="payment-option active" data-payment="CASH">
            <span class="payment-radio"></span>
            <span class="payment-text">
              <span class="payment-title">Cash</span>
              <span class="payment-desc">Pay upon receipt</span>
            </span>
            <span class="payment-icon"><i data-lucide="banknote"></i></span>
          </button>
          <button type="button" class="payment-option" data-payment="GCASH">
            <span class="payment-radio"></span>
            <span class="payment-text">
              <span class="payment-title">GCash</span>
              <span class="payment-desc">Scan QR code next step</span>
            </span>
            <span class="payment-icon"><i data-lucide="smartphone"></i></span>
          </button>
        </div>
      </section>

    </div>

    <aside class="order-summary-col">
      <div class="order-summary-card">
        <h3><i data-lucide="clipboard-list"></i> Order Summary</h3>
        <hr class="product-divider" />

        <div id="summary-lines"><!-- injected by checkout-page.js --></div>

        <hr class="product-divider" />

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">₱0.00</span>
        </div>
        <div class="summary-row">
          <span>Fulfillment Fee</span>
          <span id="summary-fee">₱0.00</span>
        </div>

        <hr class="product-divider" />

        <div class="summary-row summary-total">
          <span>Total</span>
          <span id="summary-total">₱0.00</span>
        </div>

        <button type="button" class="btn-place-order" id="place-order-btn">
          <i data-lucide="check"></i> Place Order
        </button>
      </div>
    </aside>

  </div>
</main>

<footer class="hb-footer">
  <span class="hb-footer-brand">HAPPY BURGER</span>
  <span class="hb-footer-copy">© 2024 HAPPY BURGER. ALL RIGHTS RESERVED.</span>
  <nav class="hb-footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
    <a href="#">Contact Us</a>
  </nav>
</footer>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/utils.js"></script>
<script src="../shared/data-models.js"></script>
<script src="../shared/storage.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout-page.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
