<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Happy Burger — Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/cart.css" />
</head>
<body>

<header class="hb-header">
  <a href="index.html" class="hb-logo">HAPPY BURGER</a>
  <button class="hb-burger-btn" id="hb-burger-btn" aria-label="Toggle navigation" aria-expanded="false">
    <i data-lucide="menu"></i>
  </button>
  <nav class="hb-nav" id="hb-nav">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="cart.html" class="active">Cart</a>
  </nav>
</header>

<main class="cart-page container">
  <h2>Your Cart</h2>

  <div class="cart-layout">
    <div class="cart-items-col" id="cart-items-col">
      <!-- Cart line cards injected by cart-page.js -->
    </div>

    <aside class="order-summary-col">
      <div class="order-summary-card">
        <h3>Order Summary</h3>
        <hr class="product-divider" />

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">₱0.00</span>
        </div>

        <hr class="product-divider" />

        <div class="summary-row summary-total">
          <span>Total</span>
          <span id="summary-total">₱0.00</span>
        </div>

        <a href="checkout.html" class="btn-checkout" id="checkout-btn">
          Proceed to Checkout →
        </a>
      </div>
    </aside>
  </div>
</main>

<footer class="hb-footer">
  <span class="hb-footer-brand">HAPPY BURGER</span>
  <span class="hb-footer-copy">© 2024 HAPPY BURGER. ALL RIGHTS RESERVED.</span>
  <nav class="hb-footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
    <a href="#">Contact Us</a>
  </nav>
</footer>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/nav.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/utils.js"></script>
<script src="../shared/data-models.js"></script>
<script src="../shared/storage.js"></script>
<script src="js/cart.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
