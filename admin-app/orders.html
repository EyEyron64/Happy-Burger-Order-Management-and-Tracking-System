<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Happy Burger Management — Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/orders.css" />
</head>
<body>

<div class="admin-shell">

  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">HAPPY BURGER</div>

    <nav class="admin-sidebar-nav">
      <a href="dashboard.html">
        <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Dashboard
      </a>
      <a href="orders.html" class="active">
        <span class="nav-icon"><i data-lucide="clipboard-list"></i></span> Orders
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="#" class="cosmetic-link" onclick="event.preventDefault();"><i data-lucide="life-buoy"></i> Support</a>
      <a href="#" class="cosmetic-link" onclick="event.preventDefault();"><i data-lucide="help-circle"></i> Help Center</a>
    </div>
  </aside>

  <div class="admin-main">

    <header class="admin-topbar">
      <h2 class="admin-topbar-title">Happy Burger Management</h2>
      <div class="admin-topbar-icons">
        <button class="icon-btn" onclick="event.preventDefault();" title="Notifications"><i data-lucide="bell"></i></button>
        <button class="icon-btn" onclick="event.preventDefault();" title="Account"><i data-lucide="user"></i></button>
        <button class="icon-btn" onclick="event.preventDefault();" title="Settings"><i data-lucide="settings"></i></button>
      </div>
    </header>

    <main class="admin-content">

      <div class="admin-page-heading">
        <div>
          <h1>Active Orders</h1>
          <p class="text-muted">Manage and track current kitchen tickets.</p>
        </div>
      </div>

      <div class="orders-toolbar">
        <div class="orders-tabs" id="orders-tabs">
          <!-- Tab buttons injected by orders.js -->
        </div>
        <div class="admin-search-box">
          <span class="admin-search-icon"><i data-lucide="search"></i></span>
          <input type="text" placeholder="Search orders…" id="orders-search-input" />
        </div>
      </div>

      <div class="orders-table-card">
        <table class="orders-table">
          <thead>
            <tr>
              <th>Order #</th>
              <th>Items</th>
              <th>Fulfillment</th>
              <th>Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="orders-table-body">
            <!-- Rows injected by orders.js -->
          </tbody>
        </table>
        <div class="orders-empty" id="orders-empty" style="display:none;">No orders match this view.</div>
      </div>

    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/utils.js"></script>
<script src="../shared/storage.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
